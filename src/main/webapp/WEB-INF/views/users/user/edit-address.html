<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa thông tin khách hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="bg-blue-50 min-h-screen py-10 font-sans">

<div class="max-w-xl mx-auto bg-white shadow-md rounded-lg p-8">
    <h2 class="text-2xl font-bold text-yellow-600 mb-6 text-center">Sửa thông tin khách hàng</h2>

    <form th:action="@{/user/edit}" method="post" th:object="${user}" class="space-y-4">
        <input type="hidden" th:field="*{userID}" />

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Tên khách hàng</label>
            <input type="text" th:field="*{username}" class="w-full border border-gray-300 rounded px-3 py-2"
                   required/>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Số điện thoại</label>
            <input type="text" th:field="*{phone}" class="w-full border border-gray-300 rounded px-3 py-2"
                   required/>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Email</label>
            <input type="email" th:field="*{email}" class="w-full border border-gray-300 rounded px-3 py-2"
                   required/>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Địa chỉ</label>
            <textarea th:field="*{address}" class="w-full border border-gray-300 rounded px-3 py-2"
                      rows="3" required></textarea>
        </div>

        <div class="flex justify-end mt-6">
            <button type="submit"
                    class="bg-yellow-500 text-white font-semibold px-6 py-2 rounded hover:bg-yellow-600">
                Cập nhật
            </button>
        </div>
    </form>
</div>

</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        window.confirmLogout = function () {
            Swal.fire({
                title: 'Bạn có chắc chắn muốn đăng xuất?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Đăng xuất',
                cancelButtonText: 'Hủy',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/logout';
                }
            });
        };
    });
</script>
</html>
