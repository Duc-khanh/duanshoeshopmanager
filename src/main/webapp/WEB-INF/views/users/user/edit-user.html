<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Chỉnh sửa tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>
<body class="bg-gray-50 min-h-screen font-['Roboto'] flex flex-col">

<header class="w-full" th:replace="/users/layout :: header"></header>


<main class="flex-1 flex items-center justify-center mt-6 p-6">
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-8">
        <h2 class="text-3xl font-extrabold mb-8 text-center text-gray-900">Cập nhật tài khoản</h2>
    <form th:action="@{/users/user/update}" method="post" th:object="${user}" class="space-y-6">
        <input type="hidden" th:field="*{userID}" />

        <div>
            <label for="username" class="block text-gray-700 font-semibold mb-2">Tên đăng nhập</label>
            <div class="relative">
                <input
                        id="username"
                        type="text"
                        th:field="*{username}"
                        class="w-full border border-gray-300 rounded-md p-3 pl-10 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Nhập tên đăng nhập"
                />
                <span class="absolute left-3 top-3 text-indigo-500">
                    <i class="fas fa-user"></i>
                </span>
            </div>
        </div>

        <div>
            <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
            <div class="relative">
                <input
                        id="email"
                        type="email"
                        th:field="*{email}"
                        class="w-full border border-gray-300 rounded-md p-3 pl-10 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Nhập email"
                />
                <span class="absolute left-3 top-3 text-indigo-500">
                    <i class="fas fa-envelope"></i>
                </span>
            </div>
        </div>

        <div>
            <label for="address" class="block text-gray-700 font-semibold mb-2">Địa chỉ</label>
            <div class="relative">
                <input
                        id="address"
                        type="text"
                        th:field="*{address}"
                        class="w-full border border-gray-300 rounded-md p-3 pl-10 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Nhập địa chỉ"
                />
                <span class="absolute left-3 top-3 text-indigo-500">
                    <i class="fas fa-map-marker-alt"></i>
                </span>
            </div>
        </div>

        <div class="text-center">
            <button
                    type="submit"
                    class="w-full md:w-auto px-8 py-3 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 transition"
            >
                Lưu thay đổi
            </button>
        </div>
    </form>
    </div>
</main>

<footer class="w-full mt-12" th:replace="/users/layout :: footer"></footer>

</body>
</html>
