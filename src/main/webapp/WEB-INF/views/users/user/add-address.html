<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm khách hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen py-10 font-sans">

<div class="max-w-xl mx-auto bg-white shadow-md rounded-lg p-8">
    <h2 class="text-2xl font-bold text-blue-700 mb-6 text-center">Thêm khách hàng</h2>

    <form th:action="@{/user/add}" method="post" th:object="${user}" class="space-y-4">

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Tên khách hàng</label>
            <input type="text" th:field="*{username}" class="w-full border border-gray-300 rounded px-3 py-2"
                   placeholder="Nhập tên khách hàng" required/>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Số điện thoại</label>
            <input type="text" th:field="*{phone}" class="w-full border border-gray-300 rounded px-3 py-2"
                   placeholder="Nhập số điện thoại" required/>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Email</label>
            <input type="email" th:field="*{email}" class="w-full border border-gray-300 rounded px-3 py-2"
                   placeholder="Nhập email" required/>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Địa chỉ</label>
            <textarea th:field="*{address}" class="w-full border border-gray-300 rounded px-3 py-2"
                      rows="3" placeholder="Nhập địa chỉ" required></textarea>
        </div>

        <div class="flex justify-end mt-6">
            <button type="submit"
                    class="bg-green-600 text-white font-semibold px-6 py-2 rounded hover:bg-green-700">
                Thêm
            </button>
        </div>
    </form>
</div>

</body>
</html>
