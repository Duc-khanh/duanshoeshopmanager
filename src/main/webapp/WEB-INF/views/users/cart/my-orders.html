<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đơn hàng của tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;

        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="w-full fixed top-0 left-0 right-0" th:replace="/users/layout :: header"></div>

<div class="w-full bg-white rounded-2xl shadow-lg p-6 sm:p-10 max-w-screen-xl mx-auto ">

    <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-3xl font-semibold text-gray-800 mb-4 sm:mb-0">Đơn hàng của bạn</h1>

        <form method="get" action="/my-orders" class="mb-4 flex items-center gap-4">
            <label for="status" class="text-gray-700 font-medium">Lọc theo trạng thái:</label>
            <select id="status" name="status" class="border border-gray-300 rounded px-3 py-1 text-sm">
                <option value="" th:selected="${selectedStatus == null}">Tất cả</option>
                <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Chờ xác nhận</option>
                <option value="CONFIRMED" th:selected="${selectedStatus == 'CONFIRMED'}">Đã xác nhận</option>
                <option value="SHIPPED" th:selected="${selectedStatus == 'SHIPPED'}">Đang giao</option>
                <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Đã huỷ</option>
            </select>

            <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded">Lọc</button>
        </form>


    </header>

    <div class="rounded-lg border border-gray-200 shadow-sm w-full overflow-hidden">
        <table class="min-w-full table-auto divide-y divide-gray-200 w-full">

            <thead class="bg-indigo-50">
            <tr>
                <th scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    #
                </th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">Mã đơn
                    hàng
                </th>
                <!--                <th class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">Số lượng SP</th>-->


                <th scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Tổng tiền
                </th>
                <th scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Trạng thái
                </th>
                <th scope="col"
                    class="px-6 py-3 text-center text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Chi tiết
                </th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100">
            <tr th:each="order , index : ${orders}" class="hover:bg-indigo-50 transition-colors cursor-pointer">
                <td class="px-6 py-4 whitespace-nowrap text-gray-900 font-medium"
                    th:text="${index.index + 1 + currentPage * pageSize}">1
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-gray-700" th:text="${order.orderID}">DH00123</td>


                <td class="px-6 py-4 whitespace-nowrap text-gray-700"
                    th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">1,250,000 đ
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
    <span th:switch="${order.status}">
        <span th:case="'PENDING'"
              class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-yellow-200 text-yellow-900"
              th:text="${order.status.displayName}">Chờ xác nhận</span>

        <span th:case="'CONFIRMED'"
              class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-blue-200 text-blue-900"
              th:text="${order.status.displayName}">Đã xác nhận</span>

        <span th:case="'SHIPPED'"
              class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-green-200 text-green-900"
              th:text="${order.status.displayName}">Đang giao</span>

        <span th:case="'CANCELLED'"
              class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-red-200 text-red-900"
              th:text="${order.status.displayName}">Đã huỷ</span>

        <span th:case="*"
              class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-gray-200 text-gray-900"
              th:text="${order.status.displayName}">Không xác định</span>
    </span>
                </td>


                <td class="px-6 py-4 whitespace-nowrap text-center space-y-2">
                    <a th:href="@{/order/details/{id}(id=${order.orderID})}"
                       class="inline-flex items-center justify-center gap-1 px-3 py-1 text-sm font-medium text-indigo-600 hover:text-indigo-800 border border-indigo-200 hover:border-indigo-400 rounded-full transition">
                        <i class="fas fa-circle-info"></i>
                        <span>Xem</span>
                    </a>

                    <th:block th:if="${order.status.name() == 'PENDING'}">
                        <form th:action="@{/order/cancel/{id}(id=${order.orderID})}"
                              method="post"
                              onsubmit="return confirmCancel(event, this)">

                            <button type="submit"
                                    class="inline-flex items-center justify-center gap-1 px-3 py-1 text-sm font-medium text-red-600 hover:text-white border border-red-300 hover:bg-red-600 rounded-full transition">
                                <i class="fas fa-ban"></i>
                                <span>Huỷ</span>
                            </button>
                        </form>
                    </th:block>



                </td>


            </tr>
            </tbody>

        </table>
        <div class="mt-6 flex justify-center">
            <ul class="inline-flex -space-x-px text-sm">
                <li th:if="${currentPage > 0}">
                    <a th:href="@{/my-orders(page=${currentPage - 1}, status=${selectedStatus})}"
                       class="px-3 py-1 bg-white border border-gray-300 text-gray-600 hover:bg-gray-100">Trước</a>
                </li>

                <li th:if="${currentPage > 2}">
                    <a th:href="@{/my-orders(page=0, status=${selectedStatus})}"
                       class="px-3 py-1 border border-gray-300 bg-white text-gray-700 hover:bg-gray-100">1</a>
                    <span class="px-3 py-1 border border-gray-300 bg-white text-gray-500">...</span>
                </li>

                <li th:each="i : ${#numbers.sequence((currentPage > 2 ? currentPage - 2 : 0), (currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1))}">
                    <a th:href="@{/my-orders(page=${i}, status=${selectedStatus})}"
                       th:text="${i + 1}"
                       th:classappend="${i == currentPage} ? 'bg-blue-500 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
                       class="px-3 py-1 border border-gray-300"></a>
                </li>

                <li th:if="${currentPage + 3 < totalPages}">
                    <span class="px-3 py-1 border border-gray-300 bg-white text-gray-500">...</span>
                    <a th:href="@{/my-orders(page=${totalPages - 1}, status=${selectedStatus})}"
                       th:text="${totalPages}"
                       class="px-3 py-1 border border-gray-300 bg-white text-gray-700 hover:bg-gray-100"></a>
                </li>

                <li th:if="${currentPage < totalPages - 1}">
                    <a th:href="@{/my-orders(page=${currentPage + 1}, status=${selectedStatus})}"
                       class="px-3 py-1 bg-white border border-gray-300 text-gray-600 hover:bg-gray-100">Tiếp</a>
                </li>
            </ul>
        </div>

    </div>
</div>
<div class="w-full" th:replace="/users/layout :: footer"></div>
<script th:inline="javascript">
        let addToCartSuccess = /*[[${addToCartSuccess}]]*/ false;
        let cancelSuccess = /*[[${cancelSuccess}]]*/ false;

        const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2500,
        timerProgressBar: true,
        didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
    }
    });

        if (addToCartSuccess) {
        Toast.fire({
            icon: 'success',
            title: 'Đặt hàng thành công!'
        });
    }

        if (cancelSuccess) {
        Toast.fire({
            icon: 'success',
            title: 'Huỷ đơn hàng thành công!'
        });
    }


function confirmCancel(event, formElement) {
        event.preventDefault();

        Swal.fire({
            title: 'Bạn có chắc chắn muốn huỷ đơn hàng này?',
            text: "Hành động này không thể hoàn tác.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Huỷ đơn hàng',
            cancelButtonText: 'Không'
        }).then((result) => {
            if (result.isConfirmed) {
                formElement.submit();
            }
        });

        return false;
    }


</script>

</body>
</html>
