<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đơn hàng của tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="w-full fixed top-0 left-0 right-0" th:replace="/users/layout :: header"></div>

    <div class="w-full bg-white rounded-2xl shadow-lg p-6 sm:p-10 max-w-screen-xl mx-auto">

    <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-3xl font-semibold text-gray-800 mb-4 sm:mb-0">Đơn hàng của bạn</h1>

        <form method="get" action="/my-orders" class="mb-4 flex items-center gap-4">
            <label for="status" class="text-gray-700 font-medium">Lọc theo trạng thái:</label>
            <select id="status" name="status" class="border border-gray-300 rounded px-3 py-1 text-sm">
                <option value="" th:selected="${selectedStatus == null}">Tất cả</option>
                <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Chờ xác nhận</option>
                <option value="CONFIRMED" th:selected="${selectedStatus == 'CONFIRMED'}">Đã xác nhận</option>
                <option value="SHIPPED" th:selected="${selectedStatus == 'SHIPPED'}">Đang giao</option>
                <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Đã huỷ</option>
            </select>

            <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded">Lọc</button>
        </form>


    </header>

    <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-indigo-50">
            <tr>
                <th scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Mã đơn
                </th>
                <th scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Tổng tiền
                </th>
                <th scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Trạng thái
                </th>
                <th scope="col"
                    class="px-6 py-3 text-center text-xs font-semibold text-indigo-700 uppercase tracking-wider">
                    Chi tiết
                </th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100">
            <tr th:each="order : ${orders}" class="hover:bg-indigo-50 transition-colors cursor-pointer">
                <td class="px-6 py-4 whitespace-nowrap text-gray-900 font-medium" th:text="${order.orderID}">#DH00123
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-gray-700"
                    th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 2, 'POINT')} + ' đ'">1,250,000 đ
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
 <span th:switch="${order.status}">
    <span th:case="'PENDING'"
          class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-yellow-100 text-yellow-800"
          th:text="${order.status}">Chờ xác nhận</span>
    <span th:case="'CONFIRMED'"
          class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-blue-100 text-blue-800"
          th:text="${order.status}">Đã xác nhận</span>
    <span th:case="'SHIPPED'"
          class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800"
          th:text="${order.status}">Đang giao</span>
    <span th:case="'CANCELLED'" class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-800"
          th:text="${order.status}">Đã huỷ</span>
    <span th:case="*"
          class="inline-flex px-3 py-1 rounded-full text-sm font-semibold bg-gray-100 text-gray-700"
          th:text="${order.status}">Khác</span>
</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-center">
                    <a th:href="@{/order/detail/{id}(id=${order.orderID})}"
                       class="text-indigo-600 hover:text-indigo-900 font-semibold flex justify-center items-center space-x-1">
                        <i class="fas fa-eye"></i><span>Xem</span>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="w-full" th:replace="/users/layout :: footer"></div>

</body>
</html>
