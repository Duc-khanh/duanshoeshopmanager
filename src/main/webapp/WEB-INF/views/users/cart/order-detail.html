<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết hóa đơn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>


</head>
<!--<body class="bg-white text-gray-900 font-sans max-w-7xl mx-auto p-6">-->
<body class="bg-gradient-to-b from-blue-50 to-white min-h-screen flex flex-col">
<div  th:replace="/users/layout :: header"></div>

<h2 class="text-3xl font-extrabold mb-10 text-center">Chi tiết hóa đơn</h2>

<div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
    <section class="lg:col-span-7 bg-gray-50 p-8 rounded-md shadow-md">
        <h3 class="font-extrabold text-xl border-b border-blue-500 pb-2 mb-6 text-blue-700">Thông tin khách hàng</h3>
        <table class="w-full text-left text-gray-800 text-base leading-relaxed border-collapse">
            <tbody>
            <tr class="border-b border-gray-300">
                <th class="py-3 px-4 font-semibold text-gray-900 w-40">Khách hàng</th>
                <td class="py-3 px-4" th:text="${order.user.username}">Nguyễn Văn A</td>
            </tr>
            <tr class="border-b border-gray-300">
                <th class="py-3 px-4 font-semibold text-gray-900">Email</th>
                <td class="py-3 px-4" th:text="${order.user.email}">nguyenvana@example.com</td>
            </tr>
            <tr>
                <th class="py-3 px-4 font-semibold text-gray-900">Địa chỉ</th>
                <td class="py-3 px-4" th:text="${order.user.address}">123 Đường ABC, Quận 1, TP.HCM</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="lg:col-span-5 flex flex-col justify-between border border-gray-200 rounded-md shadow-md">
        <div>
            <div class="bg-blue-100 px-6 py-4 rounded-t-md">
                <h3 class="font-extrabold text-lg text-blue-900">Giỏ hàng</h3>
            </div>
            <div class="p-6">
                <h4 class="font-bold mb-4 text-gray-900">Danh sách sản phẩm</h4>
                <ul class="mb-6 space-y-4 text-gray-700">
                    <li
                            th:each="detail : ${order.orderDetails}"
                            class="flex justify-between border-b border-gray-300 pb-3 last:border-b-0"
                    >
                        <span th:text="${detail.product.productName}">Điện thoại</span>
                        <span class="text-right font-medium" th:text="${#numbers.formatDecimal(detail.price * detail.quantity / 1000, 0, 'COMMA', 3, 'POINT')} + ' đ'">20.000 đ</span>
                    </li>
                </ul>
                <hr class="border-gray-300 mb-5" />
                <div class="flex justify-between mb-3 text-gray-900 font-bold text-base">
                    <span>Tổng tiền</span>
                    <span th:text="${#numbers.formatDecimal(order.totalAmount / 1000, 0, 'COMMA', 3, 'POINT')} + ' đ'">20.000 đ</span>
                </div>
                <div class="flex justify-between mb-6 text-gray-900 font-semibold text-base">
                    <span>Phụ phí</span>
                    <span>0 đ</span>
                </div>
                <hr class="border-gray-300 mb-6" />
                <div class="flex justify-between text-gray-900 font-extrabold text-lg">
                    <span>Tổng tiền</span>
                    <span th:text="${#numbers.formatDecimal(order.totalAmount / 1000, 0, 'COMMA', 3, 'POINT')} + ' đ'">20.000 đ</span>
                </div>
            </div>
        </div>
        <div class="border-t border-gray-200 p-6">
            <a
                    th:href="@{/users}"
                    type="submit"
                    class="block text-center w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-md transition-colors duration-300"
            >
                Đặt hàng
            </a>
        </div>
    </section>
</div>
<div  th:replace="/users/layout :: footer"></div>
</body>
</html>
