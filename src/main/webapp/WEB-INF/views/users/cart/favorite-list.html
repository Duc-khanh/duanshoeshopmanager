<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Sản phẩm yêu thích của bạn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
            rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: "Roboto", sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="w-full fixed top-0 left-0 right-0" th:replace="/users/layout :: header"></div>
<div class="max-w-6xl mx-auto px-4 py-8 pt-24">
    <h1 class="text-3xl font-extrabold mb-8 text-center text-gray-900">
        Sản phẩm yêu thích của bạn
    </h1>

    <div th:if="${#lists.isEmpty(favoriteProducts)}" class="text-center text-red-600  py-20">
        <i class="fas fa-heart-broken text-6xl mb-6 text-gray-400"></i>
        <p class="text-xl font-semibold">Bạn chưa có sản phẩm yêu thích nào.</p>
        <p class="mt-2 text-red-600 ">Hãy thêm sản phẩm vào danh sách yêu thích để xem tại đây.</p>
    </div>

    <div th:if="${!#lists.isEmpty(favoriteProducts)}"
         class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
        <div
                th:each="product : ${favoriteProducts}"
                class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col"
        >
            <img
                    th:src="${product.image}"
                    th:alt="'Ảnh sản phẩm: ' + ${product.productName}"
                    class="w-full h-48 object-cover"
                    height="300"
                    width="400"
            />
            <div class="p-4 flex flex-col flex-grow text-center">
                <h3
                        th:text="${product.productName}"
                        class="font-semibold text-lg text-gray-800 mb-1"
                ></h3>
                <p class="text-[#3b82f6] font-semibold text-lg mb-6"
                   th:text="${#numbers.formatDecimal(product.price / 1000  , 0, 'COMMA', 3, 'POINT')} + ' đ'">₫0</p>

                <div class="flex gap-3 mt-auto justify-center">
                    <form
                            th:action="@{/users/favorite/remove/{id}(id=${product.productID})}"
                            method="post"
                            class="flex-grow"
                            onsubmit="return confirmRemoveFavorite(event)"
                    >
                        <button
                                type="submit"
                                class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 text-sm py-2 rounded-md transition flex items-center justify-center gap-2"
                                aria-label="Xóa sản phẩm khỏi yêu thích"
                                title="Xóa"
                        >
                            <i class="fas fa-trash-alt text-lg"></i>
                            <span>Xóa</span>
                        </button>
                    </form>


                    <form th:action="@{/cart/add/{productID}(productID=${product.productID})}" method="post"
                          class="flex-grow">
                        <input type="hidden" name="quantity" value="1"/>
                        <button
                                type="submit"
                                class="w-full bg-[#60a5fa] hover:bg-[#3b82f6] text-white text-sm py-2 rounded-md font-medium transition flex items-center justify-center gap-2"
                                title="Thêm vào giỏ hàng"
                                aria-label="Thêm sản phẩm vào giỏ hàng"
                        >
                            <i class="fas fa-cart-plus text-lg"></i>
                            <span>Thêm vào giỏ</span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="/users/layout :: footer"></div>
<script th:inline="javascript">
    function confirmRemoveFavorite(event) {
        event.preventDefault(); // Ngăn form submit ngay lập tức

        Swal.fire({
            title: 'Bạn có chắc muốn xóa sản phẩm khỏi danh sách yêu thích?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Có',
            cancelButtonText: 'Không',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                event.target.submit();
            }
        });

        return false;
    }
    const deleteSuccess = /*[[${deleteSuccess}]]*/ false;

    if (deleteSuccess) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: 'Đã xóa sản phẩm khỏi danh sách yêu thích',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
        });
    }
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        window.confirmLogout = function () {
            Swal.fire({
                title: 'Bạn có chắc chắn muốn đăng xuất?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Đăng xuất',
                cancelButtonText: 'Hủy',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/logout';
                }
            });
        };
    });
</script>

</body>
</html>
