<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<div th:replace="/users/layout :: header"></div>

<main class="flex-grow container mx-auto px-4 py-10 max-w-5xl">
    <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12">
        <h1 class="text-3xl font-semibold text-gray-900 mb-10 text-center">Chi Tiết Sản Phẩm</h1>
        <div class="flex flex-col md:flex-row md:space-x-16 items-center justify-center">
            <div class="w-full md:w-1/3 flex justify-center">
                <div class="rounded-2xl overflow-hidden max-w-full max-h-[360px] flex items-center justify-center bg-white">
                    <img alt="Hình ảnh sản phẩm chi tiết, rõ nét, màu sắc trung thực, kích thước vừa phải, nền trắng"
                         class="object-contain w-full h-[360px]"
                         th:src="${product.image}" />
                </div>
            </div>
            <div class="w-full md:w-1/3 mt-10 md:mt-0 text-gray-800 flex flex-col items-center">
                <p class="text-lg font-medium mb-6 w-full max-w-md text-center">
                    Tên sản phẩm:
                    <span class="block text-3xl font-bold text-gray-900 mt-2" th:text="${product.productName}">Tên sản phẩm</span>
                </p>
                <p class="text-lg font-medium mb-8 flex-grow max-w-md text-center">
                    Mô tả:
                    <span class="block whitespace-pre-line text-gray-700 mt-2 text-base leading-relaxed" th:text="${product.description}">
                        Mô tả chi tiết sản phẩm.
                    </span>
                </p>
                <p class="text-lg font-medium mb-6 max-w-md text-center">
                    Số lượng còn lại:
                    <span class="text-gray-900 font-semibold text-xl" th:text="${product.stock}">0</span>
                </p>
                <p class="text-lg font-medium mb-10 max-w-md text-center">
                    Giá:
                    <span class="text-green-600 font-extrabold text-4xl" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 3, 'POINT')} + ' đ'">₫0</span>
                </p>
                <div class="w-full max-w-md">
                    <a class="w-full bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-semibold transition flex items-center justify-center space-x-4 shadow-lg shadow-blue-300/30 text-lg"
                       title="Thêm vào giỏ hàng" aria-label="Thêm sản phẩm vào giỏ hàng"
                       th:href="@{/cart/add/{productID}(productID=${product.productID})}">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Thêm vào giỏ hàng</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="/users/layout :: footer"></div>

</body>
</html>
