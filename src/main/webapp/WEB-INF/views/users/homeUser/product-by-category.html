<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Sản phẩm trong ' + ${selectedCategory.categoryName}">Sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-white min-h-screen flex flex-col">

<div th:replace="/users/layout :: header"></div>
<div th:replace="/users/layout :: categories"></div>

<main class="max-w-7xl mx-auto px-4 py-12 flex-grow">
    <h2 class="text-4xl font-extrabold text-gray-900 mb-12 text-center tracking-tight"
        th:text="'Sản phẩm trong danh mục: ' + ${selectedCategory.categoryName}">
        Sản phẩm trong danh mục
    </h2>

    <div th:if="${products != null and #lists.isEmpty(products) == false}"
         class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 pb-10">

        <div th:each="product : ${products}"
             class="border border-gray-300 p-4 flex flex-col group rounded-lg shadow-sm bg-white hover:shadow-lg transition relative">
            <a th:href="@{/managerUser/view/{productID}(productID=${product.productID})}"
               class="relative w-full h-44 rounded overflow-hidden bg-gray-100 flex items-center justify-center">
                <img th:src="${product.image}"
                     th:alt="'Ảnh sản phẩm ' + ${product.productName}"
                     class="object-contain max-h-full max-w-full transition-transform duration-300 ease-in-out group-hover:scale-105"
                     width="180" height="180" loading="lazy"/>

                <form th:action="@{/users/favorite/add/{id}(id=${product.productID})}" method="post"
                      class="absolute top-2 left-2 z-10">
                    <button type="submit" class="text-gray-700 hover:text-red-500 transition">
                        <i class="far fa-heart text-xl"></i>
                    </button>
                </form>

                <span th:if="${product.discountPercent != null and product.discountPercent > 0}"
                      th:text="'-' + ${product.discountPercent} + '%'"
                      class="absolute top-2 right-2 bg-red-500 text-white text-xs font-semibold px-2 py-1 rounded">
                </span>
            </a>
            <p class="text-center text-sm mt-3 font-medium" th:text="${product.productName}">Tên sản phẩm</p>
            <div class="flex justify-center mt-2 text-yellow-500 text-xs space-x-0.5">
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
            </div>
            <div class="text-center mt-2">
                <span th:if="${product.discountPercent != null and product.discountPercent > 0}"
                      th:text="${#numbers.formatDecimal((product.price * (100 - product.discountPercent)) / 100000, 0, 'COMMA', 3, 'POINT')} + ' đ'"
                      class="text-sm font-semibold text-orange-600"></span>
                <span th:if="${product.discountPercent != null and product.discountPercent > 0}"
                      th:text="${#numbers.formatDecimal(product.price / 1000, 0, 'COMMA', 3, 'POINT')} + ' đ'"
                      class="text-xs text-gray-500 line-through ml-1"></span>
                <span th:if="${product.discountPercent == null or product.discountPercent == 0}"
                      th:text="${#numbers.formatDecimal(product.price / 1000, 0, 'COMMA', 3, 'POINT')} + ' đ'"
                      class="text-sm font-semibold text-orange-600"></span>
            </div>
        </div>
    </div>

    <div th:if="${products == null or #lists.isEmpty(products)}"
         class="text-center mt-10 text-red-600 text-lg font-semibold select-none">
        Không có sản phẩm nào trong danh mục này.
    </div>
</main>

<div th:replace="/users/layout :: footer"></div>

</body>
</html>
