<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Kết quả tìm kiếm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<header class="w-full fixed top-0 left-0 right-0 z-50">
    <div th:replace="/users/layout :: header" class="w-full"></div>
</header>

<main class="flex-grow pt-[120px] px-4 py-8 max-w-7xl mx-auto w-full">
    <form th:action="@{/managerUser/searchProduct}" method="GET" class="flex max-w-2xl mx-auto"
          role="search" aria-label="Tìm kiếm sản phẩm">
        <input
                type="search"
                name="keyword"
                th:value="${keyword}"
                placeholder="Tìm kiếm sản phẩm..."
                aria-label="Tìm kiếm sản phẩm"
                class="flex-grow border border-gray-300 rounded-l-lg px-5 py-3 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
        <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-r-lg font-semibold transition flex items-center justify-center shadow-md"
                aria-label="Tìm kiếm"
        >
            <i class="fas fa-search text-lg"></i>
        </button>
    </form>

    <h2 class="text-3xl font-bold text-gray-900 text-center mb-10">Kết quả tìm kiếm</h2>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6 pb-10">
        <div th:each="product : ${searchResults}" th:if="${product.stock > 0}" class="border border-gray-300 p-6 flex flex-col group rounded-lg shadow-sm bg-white">
            <a th:href="@{/managerUser/view/{productID}(productID=${product.productID})}" class="relative w-full h-44 rounded overflow-hidden bg-gray-100 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                <img th:src="${product.image}" th:alt="'Hình ảnh sản phẩm ' + ${product.productName}" class="object-contain max-h-full max-w-full transition-transform duration-300 ease-in-out group-hover:scale-105" width="180" height="180" loading="lazy" />
            </a>
            <p class="text-center text-xs mt-2 flex-grow font-semibold" th:text="${product.productName}">Tên sản phẩm</p>
            <div class="flex justify-center mt-1 text-yellow-500 text-xs space-x-0.5">
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
            </div>
            <p class="text-center text-xs font-semibold text-orange-600 mt-1" th:text="${#numbers.formatDecimal(product.price / 1000, 0, 'COMMA', 3, 'POINT')} + ' đ'">0 đ</p>
        </div>
    </div>

    <div th:if="${searchResults == null or #lists.isEmpty(searchResults)}" class="mt-6 px-2 pb-10">
        <p class="text-center text-gray-500 text-lg font-semibold select-none">Không tìm thấy sản phẩm phù hợp.</p>
    </div>

</main>

<footer class="w-full">
    <div th:replace="/users/layout :: footer" class="w-full"></div>
</footer>

</body>
</html>
