<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Thông tin tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-['Roboto']">

<div class="w-full fixed top-0 left-0 right-0 z-50" th:replace="/users/layout :: header"></div>

<main class="flex-1 flex items-center justify-center mt-6 p-6">
    <div class="bg-white rounded-xl shadow-lg max-w-4xl w-full p-10">
        <h2 class="text-4xl font-extrabold text-gray-900 mb-10 text-center">Thông tin tài khoản</h2>
        <div class="flex flex-col items-center space-y-10">
            <img alt="Ảnh đại diện người đàn ông Việt Nam trung niên mặc áo sơ mi trắng, cười tươi, nền màu xanh nhạt" class="w-40 h-40 rounded-full object-cover border-4 border-indigo-500" th:src="@{${user.image}}" />
            <div class="flex flex-col justify-center space-y-6 w-full max-w-2xl">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-user text-indigo-600 text-2xl w-8"></i>
                    <p class="text-gray-700 text-xl font-semibold w-1/3">Tên đăng nhập:</p>
                    <p class="text-gray-900 text-xl font-medium w-2/3" th:text="${user.username}">Nguyễn Văn A</p>
                </div>
                <div class="flex items-center space-x-4">
                    <i class="fas fa-phone-alt text-indigo-600 text-2xl w-8"></i>
                    <p class="text-gray-700 text-xl font-semibold w-1/3">SĐT:</p>
                    <p class="text-gray-900 text-xl font-medium w-2/3" th:text="${user.phone}">0123456789</p>
                </div>
                <div class="flex items-center space-x-4">
                    <i class="fas fa-envelope text-indigo-600 text-2xl w-8"></i>
                    <p class="text-gray-700 text-xl font-semibold w-1/3">Email:</p>
                    <p class="text-gray-900 text-xl font-medium w-2/3" th:text="${user.email}">nguyenvana@example.com</p>
                </div>
                <div class="flex items-center space-x-4">
                    <i class="fas fa-map-marker-alt text-indigo-600 text-2xl w-8"></i>
                    <p class="text-gray-700 text-xl font-semibold w-1/3">Địa chỉ:</p>
                    <p class="text-gray-900 text-xl font-medium w-2/3" th:text="${user.address}">123 Đường Lê Lợi, Quận 1, TP. Hồ Chí Minh</p>
                </div>
                <div class="text-center mt-8">
                    <a th:href="@{/users/user/edit}"
                       class="inline-block px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition text-xl font-semibold">
                        Chỉnh sửa thông tin
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="mt-auto" th:replace="/users/layout :: footer"></footer>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        window.confirmLogout = function () {
            Swal.fire({
                title: 'Bạn có chắc chắn muốn đăng xuất?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Đăng xuất',
                cancelButtonText: 'Hủy',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/logout';
                }
            });
        };
    });
</script>
</body>
</html>
