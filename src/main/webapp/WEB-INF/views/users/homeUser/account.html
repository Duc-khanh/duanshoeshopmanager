<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Thông tin tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-['Roboto']">

<div class="w-full fixed top-0 left-0 right-0 z-50" th:replace="/users/layout :: header"></div>

<main class="flex-1 flex items-center justify-center mt-6 p-6">
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-8">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">Thông tin tài khoản</h2>
        <div class="flex flex-col items-center space-y-6">
            <img alt="Ảnh đại diện" class="w-24 h-24 rounded-full object-cover border-4 border-indigo-500" th:src="@{${user.image}}" />
            <div class="w-full space-y-4">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-user text-indigo-600 text-xl w-6"></i>
                    <p class="text-gray-700 text-lg">
                        <span class="font-semibold">Tên đăng nhập:</span>
                        <span th:text="${user.username}">Nguyễn Văn A</span>
                    </p>
                </div>
                <div class="flex items-center space-x-3">
                    <i class="fas fa-envelope text-indigo-600 text-xl w-6"></i>
                    <p class="text-gray-700 text-lg">
                        <span class="font-semibold">Email:</span>
                        <span th:text="${user.email}">nguyenvana@example.com</span>
                    </p>
                </div>
                <div class="flex items-center space-x-3">
                    <i class="fas fa-map-marker-alt text-indigo-600 text-xl w-6"></i>
                    <p class="text-gray-700 text-lg">
                        <span class="font-semibold">Địa chỉ:</span>
                        <span th:text="${user.address}">123 Đường Lê Lợi, Quận 1, TP. Hồ Chí Minh</span>
                    </p>
                </div>
                <div class="text-center mt-6">
                    <a th:href="@{/users/user/edit}"
                       class="inline-block px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        Chỉnh sửa thông tin
                    </a>
                </div>

            </div>

        </div>
    </div>
</main>

<footer class="mt-auto" th:replace="/users/layout :: footer"></footer>

</body>
</html>
