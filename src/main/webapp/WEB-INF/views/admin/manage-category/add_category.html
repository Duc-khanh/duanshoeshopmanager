    <div th:replace="/admin/layout :: sidebar"></div>

    <div class="flex-1  flex-col p-20">

        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Thêm danh mục mới</h2>
            <form action="#" th:action="@{/categories/save}" th:object="${category}" method="post" class="space-y-6" enctype="multipart/form-data">
                <div>
                    <label for="name" class="block text-gray-700 font-medium mb-2">Tên danh mục:</label>
                    <input
                            type="text"
                            id="name"
                            th:field="*{categoryName}"
                            required
                            placeholder="Nhập tên danh mục"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

<!--                <input type="file" name="imageFile" accept="image/*" />-->
                <div>
                    <label for="image" class="block text-gray-700 font-medium mb-1">Ảnh sản phẩm:</label>
                    <input
                            type="file"
                            id="image"
                            name="imageFile"
                            accept="image/*"
                            class="w-full text-gray-700"
                            onchange="previewImage(event)"
                    />
                    <div class="mt-4 flex justify-center">
                        <img
                                id="imagePreview"
                                alt="Preview ảnh sản phẩm"
                                class="max-h-48 rounded-md hidden border border-gray-300 shadow"
                        />
                    </div>
                </div>

                <button
                        type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-md transition-colors duration-300"
                >
                    Lưu
                </button>
            </form>

<div th:replace="/admin/layout :: footer"></div>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '';
            preview.classList.add('hidden');
        }
    }
</script>
