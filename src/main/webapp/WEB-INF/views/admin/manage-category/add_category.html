<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Thêm danh mục mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }


        .form-container {
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
        }
    </style>

</head>
<body class="bg-gray-100 min-h-screen">

<div class="flex min-h-screen">

    <div th:replace="/admin/layout :: sidebar"></div>

    <div class="flex flex-1 justify-center items-center p-6 ml-72">
        <div class="form-container w-full max-w-xl">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Thêm danh mục mới</h2>
            <form action="#" th:action="@{/categories/save}" th:object="${category}" method="post" class="space-y-6"
                  enctype="multipart/form-data">
                <div>
                    <label for="name" class="block text-gray-700 font-medium mb-2">Tên danh mục:</label>
                    <input
                            type="text"
                            id="name"
                            th:field="*{categoryName}"
                            required
                            placeholder="Nhập tên danh mục"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

                <div>
                    <label for="image" class="block text-gray-700 font-medium mb-1">Ảnh danh mục:</label>
                    <input
                            type="file"
                            id="image"
                            name="imageFile"
                            accept="image/*"
                            class="w-full text-gray-700"
                            onchange="previewImage(event)"
                    />
                    <div class="mt-4 flex justify-center">
                        <img
                                id="imagePreview"
                                alt="Preview ảnh sản phẩm"
                                class="max-h-48 rounded-md hidden border border-gray-300 shadow"
                        />
                    </div>
                </div>
                <button
                        type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-md transition-colors duration-300"
                >
                    Lưu
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="/admin/categories" class="text-blue-600 hover:underline font-medium">Quay lại danh sách</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="/admin/layout :: footer"></div>
<script src="/js/fragment.js"></script>
<script th:inline="javascript">
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '';
            preview.classList.add('hidden');
        }
    }
    function confirmLogout() {
        Swal.fire({
            title: 'Bạn có chắc chắn muốn đăng xuất?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Có',
            cancelButtonText: 'Không',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "/logout";
            }
        });
    }
</script>
</body>
</html>
