<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thêm người dùng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Center form container on screen */
        .form-container {
            max-width: 600px;
            margin: 3rem auto;
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

<div th:replace="/admin/layout :: sidebar"></div>
<div class="flex justify-center mt-8 ml-72">
    <div class="form-container w-full max-w-xl">


            <h1 class="text-3xl font-semibold text-gray-800 mb-8 text-center">Thêm người dùng mới</h1>
            <form th:action="@{/users/add}" method="post" enctype="multipart/form-data" th:object="${user}">

                <input type="hidden" name="userID" th:value="${user.userID}" />

                <div>
                    <label for="username" class="block text-gray-700 font-semibold mb-2">Tên đăng nhập <span class="text-red-600">*</span></label>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            th:field="*{username}"
                            required
                            minlength="3"
                            maxlength="50"
                            placeholder="Nhập tên đăng nhập"
                            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                    />
                </div>

                <div>
                    <label for="password" class="block text-gray-700 font-semibold mb-2">Mật khẩu <span class="text-red-600">*</span></label>
                    <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            name="password"
                            minlength="6"
                            maxlength="50"
                            required
                            placeholder="Nhập mật khẩu"
                            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                    />
                </div>

                <div>
                    <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input
                            type="email"
                            th:field="*{email}"
                            id="email"
                            name="email"
                            placeholder="Nhập email"
                            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                    />
                </div>
                <div>
                    <label for="address" class="block text-gray-700 font-semibold mb-2">Địa chỉ</label>
                    <input
                            type="text"
                            th:field="*{address}"
                            id="address"
                            name="address"
                            placeholder="Nhập địa chỉ"
                            th:value="${user.address}"
                            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                    />
                </div>

                <div>
                    <label for="role" class="block text-gray-700 font-semibold mb-2">Vai trò <span class="text-red-600">*</span></label>
                    <select
                            id="role"
                            name="role.roleID"
                            th:field="*{role.roleID}"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                    >
                        <option value="" disabled selected>Chọn vai trò</option>
                        <option th:each="role : ${roles}"
                                th:value="${role.roleID}"
                                th:text="${role.roleName}">
                        </option>
                    </select>
                </div>
                <div>
                    <label  class="block text-gray-700 font-medium mb-1">Ảnh sản phẩm:</label>
                    <input
                            type="file"
                            id="imageFile"
                            th:field="*{imageFile}"
                            accept="image/*"
                            class="w-full text-gray-700"
                            onchange="previewImage(event)"
                    />
                    <div class="mt-4 flex justify-center">
                        <img
                                id="imagePreview"
                                alt="Preview ảnh sản phẩm"
                                class="max-h-48 rounded-md hidden border border-gray-300 shadow"
                        />
                    </div>
                </div>


                <div class="flex justify-between items-center">
                    <a href="#" th:href="@{/admin/user}" class="inline-flex items-center px-6 py-3 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition">
                        <i class="fas fa-arrow-left mr-2"></i> Quay lại
                    </a>
                    <button
                            type="submit"
                            class="inline-flex items-center px-6 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition"
                    >
                        <i class="fas fa-user-plus mr-2"></i> Thêm người dùng
                    </button>
                </div>
            </form>
        </div>
    </div>

<div th:replace="/admin/layout :: footer"></div>
<script src="/js/fragment.js"></script>

<script th:inline="javascript">
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '';
            preview.classList.add('hidden');
        }
    }
</script>

<script th:inline="javascript" th:if="${errorMessage != null}">
    Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'error',
        title: [[${errorMessage}]],
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });
</script>

</body>
</html>
