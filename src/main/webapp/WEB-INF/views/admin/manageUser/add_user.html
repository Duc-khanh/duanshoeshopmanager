<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thêm người dùng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Center form container on screen */
        .form-container {
            max-width: 600px;
            margin: 3rem auto;
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
<div th:replace="/admin/layout :: header"></div>
<div th:replace="/admin/layout :: sidebar"></div>
<div class="form-container items-center p-6 ml-[50rem] mt-[7rem]">
    <h1 class="text-3xl font-semibold text-gray-800 mb-8 text-center">Thêm người dùng mới</h1>
    <form th:action="@{/users/save}" method="post" class="space-y-6" novalidate>
        <div>
            <label for="username" class="block text-gray-700 font-semibold mb-2">Tên đăng nhập <span class="text-red-600">*</span></label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    minlength="3"
                    maxlength="50"
                    placeholder="Nhập tên đăng nhập"
                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
            />
        </div>

        <div>
            <label for="password" class="block text-gray-700 font-semibold mb-2">Mật khẩu <span class="text-red-600">*</span></label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="6"
                    maxlength="50"
                    placeholder="Nhập mật khẩu"
                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
            />
        </div>

        <div>
            <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
            />
        </div>

        <div>
            <label for="role" class="block text-gray-700 font-semibold mb-2">Vai trò <span class="text-red-600">*</span></label>
            <select
                    id="role"
                    name="role.roleID"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
            >
            <option value="" disabled selected>Chọn vai trò</option>
            <option th:each="role : ${roles}"
                    th:value="${role.roleID}"
                    th:text="${role.roleName}">
            </option>
            </select>
        </div>


        <div class="flex justify-between items-center">
            <a href="#" th:href="@{/admin/user}" class="inline-flex items-center px-6 py-3 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition">
                <i class="fas fa-arrow-left mr-2"></i> Quay lại
            </a>
            <button
                    type="submit"
                    class="inline-flex items-center px-6 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition"
            >
                <i class="fas fa-user-plus mr-2"></i> Thêm người dùng
            </button>
        </div>
    </form>
</div>
</body>
</html>
