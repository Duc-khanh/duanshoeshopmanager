<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Chi Tiết Người Dùng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
<div th:replace="/admin/layout :: sidebar"></div>
<div th:replace="/admin/layout :: header"></div>
<div class="flex-1 flex flex-col overflow-auto p-6">


    <div class="flex justify-center items-center flex-1 ml-[28rem] mt-[7rem]">
        <div class="bg-white shadow-lg rounded-lg max-w-lg w-full p-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Chi Tiết Người Dùng</h2>
            <div class="flex flex-col space-y-6">
                <div>
                    <p class="text-gray-700 font-medium">
                        Tên đăng nhập:
                        <span class="text-xl font-semibold text-gray-800 mb-2" th:text="${user.username}">Tên đăng nhập</span>
                    </p>
                </div>
                <div>
                    <p class="text-gray-700 font-medium">
                        Email:
                        <span class="text-gray-700" th:text="${user.email != null ? user.email : 'Chưa cập nhật'}">email@example.com</span>
                    </p>
                </div>
                <div>
                    <p class="text-gray-700 font-medium">
                        Vai trò:
                        <span class="text-gray-700" th:text="${user.role != null ? user.role.roleName : 'Chưa phân quyền'}">User </span>
                    </p>
                </div>

                <div class="flex justify-center">
                    <a class="text-blue-600 hover:text-blue-800 font-semibold items-center gap-2" th:href="@{/admin/user}">
                        <i class="fas fa-arrow-left"></i>
                        Quay lại danh sách
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="/admin/layout :: footer"></div>
<script src="/js/fragment.js"></script>


</body>
</html>
