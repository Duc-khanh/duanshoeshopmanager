<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Sửa Thông Tin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
            rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="bg-gradient-to-tr from-indigo-100 via-white to-indigo-100 font-['Roboto'] min-h-screen flex flex-col">
<div th:replace="/admin/layout :: sidebar"></div>
<main class="ml-64 flex-grow flex justify-center px-4 py-20">
    <section class="bg-white rounded-xl shadow-lg p-10 w-full max-w-xl">
        <h2 class="text-2xl font-extrabold mb-8 text-center text-indigo-700 tracking-wide">
            <i class="fas fa-user-edit mr-2"></i>Chỉnh sửa thông tin
        </h2>

        <form class="space-y-7" enctype="multipart/form-data" method="post"
              th:action="@{/admin/account/edit}" th:object="${user}">
            <input th:field="*{username}" type="hidden"/>

            <!-- Avatar -->
            <div class="flex justify-center mb-6">
                <img alt="Ảnh đại diện"
                     class="w-28 h-28 rounded-full object-cover border-4 border-indigo-500 shadow"
                     id="previewImage"
                     th:src="@{${user.image}}"/>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-envelope text-indigo-600 mr-2"></i>Email
                </label>
                <div class="flex items-center border-b border-gray-300 focus-within:border-indigo-500">
                    <input
                            id="email"
                            type="email"
                            required
                            th:field="*{email}"
                            placeholder="Nhập email của bạn"
                            class="flex-1 py-2 px-1 bg-transparent focus:outline-none"
                    />
                </div>
            </div>

            <!-- Address -->
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-map-marker-alt text-indigo-600 mr-2"></i>Địa chỉ
                </label>
                <div class="flex items-center border-b border-gray-300 focus-within:border-indigo-500">
                    <input
                            id="address"
                            type="text"
                            th:field="*{address}"
                            placeholder="Nhập địa chỉ của bạn"
                            class="flex-1 py-2 px-1 bg-transparent focus:outline-none"
                    />
                </div>
            </div>

            <!-- Upload -->
            <div>
                <label for="imageFile" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-image text-indigo-600 mr-2"></i>Ảnh đại diện
                </label>
                <input
                        id="imageFile"
                        name="imageFile"
                        type="file"
                        accept="image/*"
                        onchange="previewSelectedImage(event)"
                        class="w-full file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold
                           file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer transition"
                />
            </div>

            <!-- Buttons -->
            <div class="flex justify-between items-center pt-4">
                <a href="/admin/account/info"
                   class="inline-flex items-center text-indigo-600 hover:text-indigo-800 font-medium transition text-sm">
                    <i class="fas fa-arrow-left mr-2"></i>Quay lại
                </a>
                <button type="submit"
                        class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2 px-6 rounded-lg shadow transition">
                    <i class="fas fa-save mr-2"></i>Cập nhật
                </button>
            </div>
        </form>
    </section>
</main>
<div th:replace="/admin/layout :: footer"></div>
<script src="/js/fragment.js"></script>


<script th:inline="javascript">
    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    menuBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
    });

    function previewSelectedImage(event) {
        const input = event.target;
        const preview = document.getElementById("previewImage");

        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function (e) {
                preview.src = e.target.result;
            };

            reader.readAsDataURL(input.files[0]);
        }
    }
    function confirmLogout() {
        Swal.fire({
            title: 'Bạn có chắc chắn muốn đăng xuất?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Có',
            cancelButtonText: 'Không',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "/logout";
            }
        });
    }
</script>
</body>
</html>
