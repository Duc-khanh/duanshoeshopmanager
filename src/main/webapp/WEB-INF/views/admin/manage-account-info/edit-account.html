<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Sửa Thông Tin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
            rel="stylesheet"
    />
</head>
<body class="bg-gradient-to-tr from-indigo-100 via-white to-indigo-100 font-['Roboto'] min-h-screen flex flex-col">
<div th:replace="/admin/layout :: sidebar"></div>
<div th:replace="/admin/layout :: header"></div>
<main class="ml-64 flex-grow flex justify-center px-4 py-20">
    <section class="bg-white rounded-lg shadow-lg p-8 flex flex-col items-center w-full max-w-3xl">
        <h2 class="text-3xl font-extrabold mb-2 text-center text-indigo-700 tracking-wide">
            Chỉnh sửa thông tin
        </h2>

        <form
                class="space-y-7"
                enctype="multipart/form-data"
                method="post"
                th:action="@{/admin/account/edit}"
                th:object="${user}"
        >
            <input th:field="*{username}" type="hidden" />
            <div class="flex justify-center mb-6">
                <img
                        alt="Ảnh đại diện người dùng mặc áo sơ mi xanh"
                        class="w-32 h-32 rounded-full object-cover border-4 border-indigo-500 shadow-lg"
                        height="128"
                        id="previewImage"
                        th:src="@{${user.image}}"
                        width="128"
                />
            </div>
            <div>
                <label
                        class="block font-semibold text-gray-700 mb-2"
                        for="email"
                >Email</label
                >
                <input
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                        id="email"
                        required=""
                        th:field="*{email}"
                        type="email"
                        placeholder="Nhập email của bạn"
                />
            </div>
            <div>
                <label
                        class="block font-semibold text-gray-700 mb-2"
                        for="address"
                >Địa chỉ</label
                >
                <input
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                        id="address"
                        th:field="*{address}"
                        type="text"
                        placeholder="Nhập địa chỉ của bạn"
                />
            </div>
            <div>
                <label
                        class="block font-semibold text-gray-700 mb-2"
                        for="imageFile"
                >Ảnh đại diện</label
                >
                <input
                        accept="image/*"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 cursor-pointer transition focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        id="imageFile"
                        name="imageFile"
                        onchange="previewSelectedImage(event)"
                        type="file"
                />
            </div>
            <div class="flex justify-between items-center">
                <a
                        href="/admin/account/info"
                        class="inline-flex items-center space-x-2 text-indigo-600 hover:text-indigo-800 font-semibold transition"
                >
                    <i class="fas fa-arrow-left"></i>
                    <span>Quay lại</span>
                </a>
                <button
                        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition text-sm"
                        type="submit"
                >
                    Cập nhật
                </button>
            </div>
        </form>
    </section>
</main>
<div th:replace="/admin/layout :: footer"></div>

<script>
    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    menuBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
    });

    function previewSelectedImage(event) {
        const input = event.target;
        const preview = document.getElementById("previewImage");

        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function (e) {
                preview.src = e.target.result;
            };

            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
