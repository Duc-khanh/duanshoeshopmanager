<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        img {
            width: 80px;
            height: auto;
        }

        .action-buttons a {
            margin: 0 5px;
            text-decoration: none;
            padding: 5px 10px;
            background-color: #337ab7;
            color: white;
            border-radius: 4px;
        }

        .action-buttons a.delete {
            background-color: #d9534f;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar input {
            padding: 5px;
            width: 300px;
        }

        .top-bar button {
            padding: 6px 12px;
        }
    </style>
</head>
<body>
<h1>Danh sách sản phẩm</h1>

<div class="top-bar">
    <form th:action="@{/admin/products}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm sản phẩm..."/>
        <button type="submit">Tìm</button>
    </form>
    <a th:href="@{/admin/products/create}">
        <button>Thêm sản phẩm</button>
    </a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Ảnh</th>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th>Danh mục</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.productID}"></td>
        <td>
            <img th:src="@{'/images/' + ${product.image}}" alt="No image"/>
        </td>
        <td th:text="${product.productName}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.stock}"></td>
        <td th:text="${product.category.categoryName}"></td>
        <td th:text="${product.description}"></td>
        <td class="action-buttons">
            <a th:href="@{'/admin/products/edit/' + ${product.productID}}">Sửa</a>
            <a th:href="@{'/admin/products/delete/' + ${product.productID}}" class="delete"
               onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">Xóa</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
