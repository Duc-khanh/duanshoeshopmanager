<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        form {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #28a745;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
<h2 style="text-align:center;">Thêm sản phẩm mới</h2>

<!-- ✅ enctype="multipart/form-data" để gửi file -->
<form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
    <label for="productName">Tên sản phẩm:</label>
    <input type="text" id="productName" th:field="*{productName}" required>

    <label for="description">Mô tả:</label>
    <textarea id="description" th:field="*{description}" rows="4" required></textarea>

    <label for="price">Giá:</label>
    <input type="number" id="price" th:field="*{price}" step="0.01" required>

    <label for="stock">Số lượng:</label>
    <input type="number" id="stock" th:field="*{stock}" required>

    <label for="category">Danh mục:</label>
    <select id="category" th:field="*{category}" >
        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.categoryName}"></option>
    </select>

    <!-- ✅ Đúng tên `name="imageFile"` để map đúng với @RequestParam -->
    <label for="image">Ảnh sản phẩm:</label>
    <input type="file" id="image" name="imageFile" accept="image/*" >

    <button type="submit">Thêm sản phẩm</button>
</form>

</body>
</html>
