<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Chi Tiết Sản Phẩm
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="flex min-h-screen overflow-hidden">

    <div th:replace="/admin/layout :: sidebar"></div>
    <div th:replace="/admin/layout :: header"></div>


    <div class="flex-1 flex flex-col overflow-auto">




        <div class="flex justify-center items-center flex-1 p-6">
            <div class="bg-white shadow-lg rounded-lg max-w-lg w-full p-8 ml-72">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
                    Chi Tiết Sản Phẩm
                </h2>
                <div class="flex flex-col space-y-6">
                    <div class="flex justify-center">
                        <img alt="Hình ảnh sản phẩm chi tiết"
                             class="rounded-md border border-gray-300 max-h-48 object-contain"
                             height="300" th:src="${product.image}" width="400"/>
                    </div>
                    <div>
                        <p class="text-gray-700 font-medium">
                            Tên sản phẩm:
                            <span class="text-xl font-semibold text-gray-800 mb-2" th:text="${product.productName}">
                                Tên sản phẩm
                            </span>
                        </p>
                        <p class="text-gray-700 font-medium">
                            Mô tả:
                            <span class="text-gray-700 whitespace-pre-line" th:text="${product.description}">
                                Mô tả chi tiết sản phẩm sẽ được hiển thị ở đây.
                            </span>
                        </p>
                    </div>
                    <div>
                        <p class="text-gray-700 font-medium">
                            Giá:
                            <span class="text-green-600 font-bold"
                                  th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 3, 'POINT')} + ' đ'">
                                ₫0
                            </span>
                        </p>
                    </div>
                    <div>
                        <p class="text-gray-700 font-medium">
                            Số lượng còn lại:
                            <span th:text="${product.stock}">
                                0
                            </span>
                        </p>
                    </div>
                    <div>
                        <p class="text-gray-700 font-medium">
                            Danh mục:
                            <span th:text="${product.category.categoryName}">
                                Tên danh mục
                            </span>
                        </p>
                    </div>
                    <a class="text-blue-600 hover:text-blue-800 font-semibold items-center gap-2" th:href="@{/admin/products}">
                        <i class="fas fa-arrow-left"></i>
                        Quay lại danh sách
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="/admin/layout :: footer"></div>
</body>

</html>
