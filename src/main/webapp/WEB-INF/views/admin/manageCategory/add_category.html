<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thêm danh mục mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="flex min-h-screen">
    <!-- Sidebar -->
    <div th:replace="/admin/layout :: sidebar"></div>

    <!-- Nội dung chính -->
    <div class="flex-1 p-6">

        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md mt-8">

        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Thêm danh mục mới</h2>
            <form action="#" th:action="@{/categories/save}" th:object="${category}" method="post" class="space-y-6">
                <div>
                    <label for="name" class="block text-gray-700 font-medium mb-2">Tên danh mục:</label>
                    <input
                            type="text"
                            id="name"
                            th:field="*{categoryName}"
                            required
                            placeholder="Nhập tên danh mục"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>
                <button
                        type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-md transition-colors duration-300"
                >
                    Lưu
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="/admin/categories" class="text-blue-600 hover:underline font-medium">Quay lại danh sách</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="/admin/layout :: footer"></div>

</body>
</html>
