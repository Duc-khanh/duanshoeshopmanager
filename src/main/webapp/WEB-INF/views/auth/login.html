<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
    />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white shadow-lg rounded-lg max-w-md w-full p-8">
    <h2 class="text-3xl font-semibold text-gray-800 mb-8 text-center">Đăng nhập</h2>
    <form th:action="@{/login}" method="post" class="space-y-6">
        <div>
            <label for="username" class="block text-gray-700 font-medium mb-2">Tên đăng nhập:</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    placeholder="Nhập tên đăng nhập"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <div>
            <label for="password" class="block text-gray-700 font-medium mb-2">Mật khẩu:</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Nhập mật khẩu"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-md transition-colors duration-300"
        >
            Đăng nhập
        </button>
    </form>
    <p class="mt-6 text-center text-gray-700">
        Bạn chưa có tài khoản?
        <a href="#" th:href="@{/register}" class="text-blue-600 hover:underline font-semibold">Đăng ký</a>
    </p>
    <p class="mt-4 text-center text-red-600 font-medium" th:text="${error}"></p>
</div>
</body>
</html>
