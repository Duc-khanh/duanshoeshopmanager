<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Đăng nhập
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-tr via-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
<div class="bg-white bg-opacity-90 shadow-2xl rounded-2xl max-w-4xl w-full flex flex-col md:flex-row overflow-hidden">
    <div class="md:w-1/2 hidden md:flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
        <img alt="Illustration of people using devices with security icons representing login and protection" class="object-cover h-full w-full" height="500" src="https://storage.googleapis.com/a1aa/image/87e3fa51-f86f-465d-a4de-9c2158252302.jpg" width="400"/>
    </div>
    <div class="md:w-1/2 p-10 sm:p-12 flex flex-col justify-center">
        <h2 class="text-4xl font-extrabold text-gray-900 mb-10 text-center">
            Đăng nhập
        </h2>
        <form class="space-y-8" method="post" th:action="@{/login}">
            <div>
                <label class="block text-gray-700 font-semibold mb-3" for="username">
                    Tên đăng nhập:
                </label>
                <div class="relative">
                    <input class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 pr-12" id="username" name="username" placeholder="Nhập tên đăng nhập" required="" type="text"/>
                    <span class="absolute inset-y-0 right-3 flex items-center text-indigo-500">
        <i class="fas fa-user fa-lg">
        </i>
       </span>
                </div>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-3" for="password">
                    Mật khẩu:
                </label>
                <div class="relative">
                    <input class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 pr-12" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
                    <span class="absolute inset-y-0 right-3 flex items-center text-indigo-500">
        <i class="fas fa-lock fa-lg">
        </i>
       </span>
                </div>
            </div>
            <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors duration-300 shadow-md" type="submit">
                Đăng nhập
            </button>
        </form>
        <p class="mt-8 text-center text-gray-700 text-lg">
            Bạn chưa có tài khoản?
            <a class="text-indigo-600 no-underline hover:no-underline font-semibold" th:href="@{/register}">
                Đăng ký
            </a>
        </p>
        <p class="mt-4 text-center text-red-600 font-medium" th:text="${error}">
        </p>
    </div>
</div>
</body>
<script th:if="${error}">
    Swal.fire({
        icon: 'warning',
        title: 'Thông báo',
        text: [[${error}]],
        confirmButtonText: 'OK'
    });
</script>
</html>
