<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Đăng ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-indigo-100 via-white to-indigo-100 min-h-screen flex items-center justify-center p-6">
<div class="bg-white shadow-xl rounded-2xl w-full max-w-lg p-10">
    <h2 class="text-3xl font-semibold text-indigo-700 mb-8 text-center">
        <i class="fas fa-user-plus mr-2 text-indigo-500"></i>Đăng ký tài khoản
    </h2>

    <form th:action="@{/register}" method="post" th:object="${user}" enctype="multipart/form-data"
          class="space-y-6" id="registerForm" onsubmit="return validatePasswords()">

        <div>
            <label for="username" class="block text-gray-700 font-medium mb-1">
                <i class="fas fa-user mr-1 text-indigo-500"></i> Tên đăng nhập
            </label>
            <input type="text" id="username" th:field="*{username}" required
                   placeholder="Nhập tên đăng nhập"
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>

        <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">
                <i class="fas fa-envelope mr-1 text-indigo-500"></i> Email
            </label>
            <input type="email" id="email" th:field="*{email}" required
                   placeholder="Nhập email"
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>

        <div>
            <label for="address" class="block text-gray-700 font-medium mb-1">
                <i class="fas fa-map-marker-alt mr-1 text-indigo-500"></i> Địa chỉ
            </label>
            <input type="text" id="address" th:field="*{address}" required
                   placeholder="Nhập địa chỉ"
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>

        <div>
            <label for="password" class="block text-gray-700 font-medium mb-1">
                <i class="fas fa-lock mr-1 text-indigo-500"></i> Mật khẩu
            </label>
            <input type="password" id="password" th:field="*{password}" required
                   placeholder="Nhập mật khẩu"
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>

        <div>
            <label for="confirmPassword" class="block text-gray-700 font-medium mb-1">
                <i class="fas fa-lock mr-1 text-indigo-500"></i> Nhập lại mật khẩu
            </label>
            <input type="password" id="confirmPassword" name="confirmPassword" required
                   placeholder="Nhập lại mật khẩu"
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>

        <div>
            <label for="image" class="block text-gray-700 font-medium mb-1">
                <i class="fas fa-image mr-1 text-indigo-500"></i> Ảnh đại diện
            </label>
            <input type="file" id="image" name="imageFile" accept="image/*" onchange="previewImage(event)"
                   class="w-full px-3 py-2 border rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500"/>

            <div class="mt-4 flex justify-center">
                <img id="imagePreview" src="#" alt="Ảnh xem trước" class="w-24 h-24 object-cover rounded-full border-2 border-indigo-300 shadow hidden"/>
            </div>
        </div>

        <p class="text-red-600 font-medium text-center" th:text="${error}"></p>
        <p id="errorMsg" class="text-red-600 font-medium text-center hidden"></p>

        <div class="flex justify-between mt-6 space-x-4">
           <a th:href="@{/login}"
               class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-lg shadow text-center transition">
                <i class="fas fa-arrow-left mr-2"></i>Đăng nhập
            </a>

            <button type="submit"
                    class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition">
                <i class="fas fa-user-plus mr-2"></i>Đăng ký
            </button>
        </div>

    </form>
</div>

<script>
    function validatePasswords() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMsg');

        if (password !== confirmPassword) {
            errorMsg.textContent = 'Mật khẩu nhập lại không khớp.';
            errorMsg.classList.remove('hidden');
            return false;
        } else {
            errorMsg.textContent = '';
            errorMsg.classList.add('hidden');
            return true;
        }
    }

    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');

        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '#';
            preview.classList.add('hidden');
        }
    }
</script>
</body>
</html>
